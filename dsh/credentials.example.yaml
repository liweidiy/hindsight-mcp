# Credential references used by the patch snippet.
#
# Real location:  $DSH_HOME/.credentials.yaml   (this file must never be committed)
# The values are normally written by DSH itself (Settings -> Credentials), which is
# why the patch can reference them as ${credential:NAME} without holding a secret.
#
# Illustrative shape of the section after DSH has stored the reference:

refs:
  HINDSIGHT_API_KEY: "<the Hindsight tenant API key>"

# Check without printing the value:
#   Windows  pwsh:  Select-String -Path $DSH_HOME\.credentials.yaml -Pattern 'HINDSIGHT_API_KEY' |
#                   ForEach-Object { $_.LineNumber }
#   Linux:         grep -c 'HINDSIGHT_API_KEY' "$DSH_HOME/.credentials.yaml"
